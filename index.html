<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>EL POLLO LOCO</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/gif"
      href="img/4_enemie_boss_chicken/2_alert/G11.png"
    />

    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/chicken-small.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/endboss.class.js"></script>

    <script src="levels/level1.js"></script>
  </head>

<body onload="showStart()" onresize="checkOrientation()"
      onkeydown="handleKeyDown(event)" onkeyup="handleKeyUp(event)">
  <h1>EL POLLO LOCO</h1>

  <main>
    <div id="stage">
      <canvas id="canvas" width="720" height="480"></canvas>

      <!-- Start -->
      <img id="startOverlay" class="overlay"
           src="img/9_intro_outro_screens/start/startscreen_1.png"
           alt="Startscreen"/>

      <!-- Game Over -->
      <img id="gameOverOverlay" class="overlay"
           src="img/You won, you lost/Game over A.png"
           alt="Game Over" style="display:none"/>

      <!-- You Won -->
      <img id="youWonOverlay" class="overlay"
           src="img/You won, you lost/You Win A.png"
           alt="You Won" style="display:none"/>

      <!-- Rotate-Hinweis (nur Hochformat) -->
      <div id="rotateOverlay" class="overlay rotate-center" style="display:none">
        <div class="rotate-box">
          <h2>Bitte Gerät drehen</h2>
          <p>Das Spiel funktioniert nur im <b>Querformat</b>.</p>
        </div>
      </div>

      <!-- Start-UI -->
      <div id="startUI" class="start-ui">
        <button class="start-btn" onclick="startGame()" aria-label="Spiel starten">▶</button>
      </div>

      <!-- Info-Button -->
      <button id="infoBtn" class="hud-btn" onclick="toggleInfo()" aria-label="Info">i</button>

      <!-- HUD oben rechts -->
      <div id="hud" style="position:absolute; top:10px; right:10px">
        <button id="resetBtn" class="hud-btn hud-btn--top" onclick="resetGame()" aria-label="Reset">
          <span class="icon">↻</span>
        </button>
        <button id="fsBtn" class="hud-btn hud-btn--top" style="right:56px"
                onclick="toggleFullscreen()" aria-label="Fullscreen">⛶</button>
      </div>

      <!-- Info-Card -->
      <div id="infoCard" class="info-card" onclick="hideInfo()" aria-hidden="true">
        <div class="info-box" onclick="event.stopPropagation()">
          <h3>Steuerung</h3>
          <div id="infoList"></div>
          <button class="close-btn" onclick="hideInfo()">OK</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/game.js"></script>
  <script>
    function toggleFullscreen(){                 // Deutsch: Fullscreen ein/aus
      let el=document.getElementById('stage');
      if(!document.fullscreenElement){
        if(el.requestFullscreen) el.requestFullscreen();
        else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if(el.msRequestFullscreen) el.msRequestFullscreen();
      } else {
        if(document.exitFullscreen) document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }
    document.onfullscreenchange=function(){
      let btn=document.getElementById('fsBtn');
      btn.innerText=document.fullscreenElement?'✖':'⛶';
    };
  </script>
</body>
</html>
