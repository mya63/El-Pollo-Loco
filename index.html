<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>EL POLLO LOCO</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/gif" href="img/4_enemie_boss_chicken/2_alert/G11.png" />

    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/chicken-small.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="levels/level1.js"></script>
  </head>

  <body onload="showStart()" onresize="checkOrientation()" onkeydown="handleKeyDown(event)" onkeyup="handleKeyUp(event)">
    <h1>EL POLLO LOCO</h1>

    <main>
      <div id="stage">
        <canvas id="canvas" width="720" height="480" tabindex="0"></canvas>

        <img id="startOverlay" class="overlay" src="img/9_intro_outro_screens/start/startscreen_1.png" alt="Startscreen" />

        <img id="gameOverOverlay" class="overlay" src="img/You won, you lost/Game over A.png" alt="Game Over" style="display:none" />

        <img id="youWonOverlay" class="overlay" src="img/You won, you lost/You Win A.png" alt="You Won" style="display:none" />

        <div id="rotateOverlay" class="overlay rotate-center" style="display:none">
          <div class="rotate-box">
            <h2>Bitte Gerät drehen</h2>
            <p>Das Spiel funktioniert nur im <b>Querformat</b>.</p>
          </div>
        </div>

        <div id="startUI" class="start-ui">
          <button class="start-btn" tabindex="-1"
                  onclick="startGame()" onmousedown="return blurToCanvas(this)"
                  aria-label="Spiel starten">▶</button>
        </div>

        <button id="infoBtn" class="hud-btn" tabindex="-1"
                onclick="toggleInfo()" onmousedown="return blurToCanvas(this)"
                aria-label="Info">i</button>

        <div id="hud" style="position:absolute; top:10px; right:10px">
          <button id="resetBtn" class="hud-btn hud-btn--top" tabindex="-1"
                  onclick="resetGame()" onmousedown="return blurToCanvas(this)"
                  aria-label="Reset"><span class="icon">↻</span></button>
          <button id="fsBtn" class="hud-btn hud-btn--top" tabindex="-1" style="right:56px"
                  onclick="toggleFullscreen()" onmousedown="return blurToCanvas(this)"
                  aria-label="Fullscreen">⛶</button>
        </div>

        <div id="infoCard" class="info-card" onclick="hideInfo()" aria-hidden="true">
          <div class="info-box" onclick="event.stopPropagation()">
            <h3>Steuerung</h3>
            <div id="infoList"></div>
            <button class="close-btn" tabindex="-1"
                    onclick="hideInfo()" onmousedown="return blurToCanvas(this)">OK</button>
          </div>
        </div>
      </div>
    </main>

    <div id="pads" class="pads" aria-hidden="true">
      <div class="pad pad-left">
        <button class="pad-btn"
          onpointerdown="press('LEFT',this)"  onpointerup="release('LEFT',this)"
          onpointerout="release('LEFT',this)"
          onmousedown="press('LEFT',this)"    onmouseup="release('LEFT',this)"
          onmouseleave="release('LEFT',this)">◀</button>

        <button class="pad-btn"
          onpointerdown="press('RIGHT',this)" onpointerup="release('RIGHT',this)"
          onpointerout="release('RIGHT',this)"
          onmousedown="press('RIGHT',this)"   onmouseup="release('RIGHT',this)"
          onmouseleave="release('RIGHT',this)">▶</button>
      </div>

      <div class="pad pad-right">
        <button class="pad-btn"
          onpointerdown="press('SPACE',this)" onpointerup="release('SPACE',this)"
          onpointerout="release('SPACE',this)"
          onmousedown="press('SPACE',this)"   onmouseup="release('SPACE',this)"
          onmouseleave="release('SPACE',this)">Jump</button>

        <button class="pad-btn"
          onpointerdown="press('D',this)"     onpointerup="release('D',this)"
          onpointerout="release('D',this)"
          onmousedown="press('D',this)"       onmouseup="release('D',this)"
          onmouseleave="release('D',this)">🧴</button>
      </div>
    </div>

    <script src="js/game.js"></script>
  </body>
</html>
