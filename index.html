<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>EL POLLO LOCO</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/gif" href="img/8_coin/coin_2.png" />

    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/endboss.class.js"></script>

    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>
  </head>

  <body
    onload="showStart()"
    onkeydown="handleKeyDown(event)"
    onkeyup="handleKeyUp(event)"
  >
    <h1>EL POLLO LOCO</h1>

    <main>
      <div id="stage">
        <canvas id="canvas" width="720" height="480"></canvas>
        <img
          id="startOverlay"
          class="overlay"
          src="img/9_intro_outro_screens/start/startscreen_1.png"
          onclick="startGame()"
          alt="Startscreen"
        />

        <button
          id="infoBtn"
          class="hud-btn"
          onclick="toggleInfo()"
          aria-label="Info"
        >
          i
        </button>

        <div
          id="infoCard"
          class="info-card"
          onclick="hideInfo()"
          aria-hidden="true"
        >
          <div class="info-box" onclick="event.stopPropagation()">
            <h3>Steuerung</h3>
            <div id="infoList"></div>
            <button class="close-btn" onclick="hideInfo()">OK</button>
          </div>
        </div>
      </div>

    </main>
  </body>
</html>
